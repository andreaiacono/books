<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBooks — Edit Book</title>
  <link rel="stylesheet" href="css/style.css">
  <script>(function(){var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');document.documentElement.dataset.theme=t;})();</script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0e0d">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__brand">MyBooks</a>
  <ul class="nav__links">
    <li><a href="reading-log.html">Reading Log</a></li>
    <li><a href="settings.html">Settings</a></li>
  </ul>
  <div class="nav__actions">
    <a href="add.html" class="btn btn--primary" style="padding:0.4rem 1rem;font-size:13px">+ Add Book</a>
    <button id="theme-toggle" class="theme-toggle">☀</button>
  </div>
</nav>

<main class="page" style="max-width:760px" id="main-content">
  <div class="empty-state">
    <div class="loader__spinner" style="width:32px;height:32px;margin:0 auto"></div>
  </div>
</main>

<script type="module">
  import { loadGrid, saveNewBook, isConfigured } from './js/data.js';
  import { toast, escHtml } from './js/ui.js';
  import { SUBJECTS } from './js/constants.js';
  import { fileToWebPBase64 } from './js/image-utils.js';


  let originalBook = null;
  let coverBase64 = null;
  let coverChanged = false;

  async function init() {
    const main = document.getElementById('main-content');

    if (!isConfigured()) {
      main.innerHTML = `
        <div class="empty-state">
          <div class="empty-state__icon">⚙️</div>
          <h2>GitHub not configured</h2>
          <p>Set your Personal Access Token and repository in <a href="settings.html">Settings</a> to enable editing.</p>
        </div>`;
      return;
    }

    const isbn = new URLSearchParams(location.search).get('isbn');
    if (!isbn) { render404(); return; }

    const grid = await loadGrid();
    originalBook = grid.find(b => b.isbn === isbn);
    if (!originalBook) { render404(); return; }

    const publishers = [...new Set(grid.map(b => b.publisher).filter(Boolean))].sort((a, b) => a.localeCompare(b));

    document.title = `Edit: ${originalBook.title} — MyBooks`;
    renderForm(originalBook, publishers);
  }

  function renderForm(book, publishers) {
    const main = document.getElementById('main-content');
    const subjects = Array.isArray(book.subjects) ? book.subjects : [];
    const currentSubject = subjects[0] || '';

    main.innerHTML = `
      <header class="page-header">
        <h1>Edit Book</h1>
        <p>${escHtml(book.title)}</p>
      </header>

      <div style="display:grid;grid-template-columns:140px 1fr;gap:1.5rem;margin-bottom:1.5rem">
        <div>
          <img id="cover-preview"
               src="${escHtml(book.cover ?? 'assets/no-cover.svg')}"
               alt="Cover"
               onerror="this.src='assets/no-cover.svg'"
               style="width:140px;height:210px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border)">
          <label class="btn btn--ghost" style="display:block;text-align:center;font-size:12px;margin-top:0.5rem;cursor:pointer">
            Change cover
            <input type="file" id="cover-file" accept="image/*" style="display:none">
          </label>
          <button type="button" id="paste-cover-btn" class="btn btn--ghost" style="font-size:12px;margin-top:0.4rem;display:block;width:100%;text-align:center;cursor:pointer">
            Paste cover
          </button>
          <p style="font-size:10px;color:var(--text-faint);margin-top:0.3rem;text-align:center">or press ⌘/Ctrl+V</p>
          <p id="cover-status" style="font-size:11px;color:var(--text-faint);margin-top:0.25rem;text-align:center"></p>
        </div>
        <div>
          <div class="form-group">
            <label class="form-label" for="f-title">Title *</label>
            <input type="text" id="f-title" value="${escHtml(book.title)}" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-author">Author(s) *</label>
            <input type="text" id="f-author" value="${escHtml(book.author)}" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f-year">Year</label>
              <input type="number" id="f-year" min="1000" max="2099" value="${book.year ?? ''}">
            </div>
            <div class="form-group">
              <label class="form-label">ISBN</label>
              <input type="text" value="${escHtml(book.isbn)}" readonly style="opacity:0.6;cursor:default">
            </div>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="f-publisher">Publisher</label>
          <input type="text" id="f-publisher" list="publisher-list" value="${escHtml(book.publisher)}">
          <datalist id="publisher-list">
            ${publishers.map(p => `<option value="${escHtml(p)}">`).join('')}
          </datalist>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-pages">Pages</label>
          <input type="number" id="f-pages" min="1" value="${book.pages ?? ''}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="f-subject">Subject</label>
        <select id="f-subject">
          <option value="">— None —</option>
          ${SUBJECTS.map(s => `<option value="${escHtml(s)}"${s === currentSubject ? ' selected' : ''}>${escHtml(s)}</option>`).join('')}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="f-description">Description</label>
        <textarea id="f-description" rows="5" style="resize:vertical">${escHtml(book.description ?? '')}</textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="f-language">Language</label>
          <input type="text" id="f-language" value="${escHtml(book.lang)}" placeholder="e.g. en">
        </div>
        <div class="form-group">
          <label class="form-label" for="f-added">Added</label>
          <input type="date" id="f-added" value="${escHtml(book.added ?? '')}">
        </div>
      </div>

      <div style="display:flex;gap:0.75rem;margin-top:0.5rem">
        <button class="btn btn--primary" id="save-btn">Save Changes</button>
        <button class="btn btn--ghost" id="cancel-btn">Cancel</button>
      </div>

      <div id="save-progress" style="display:none;margin-top:1rem">
        <div style="height:4px;background:var(--bg-raised);border-radius:2px;overflow:hidden">
          <div id="progress-bar" style="height:100%;width:0%;background:var(--accent);transition:width 0.4s ease"></div>
        </div>
        <p id="save-status" style="font-size:13px;color:var(--text-muted);margin-top:0.5rem"></p>
      </div>
    `;

    // Cover from a file or a pasted blob
    async function setCoverFromBlob(blob) {
      if (!blob || !blob.type.startsWith('image/')) return false;
      const statusEl = document.getElementById('cover-status');
      statusEl.textContent = 'Processing…';
      try {
        coverBase64 = await fileToWebPBase64(blob);
        coverChanged = true;
        document.getElementById('cover-preview').src = `data:image/webp;base64,${coverBase64}`;
        statusEl.textContent = 'New cover ready';
        return true;
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Failed to process image';
        toast('Could not process cover image', 'error');
        return false;
      }
    }

    // Cover file picker
    document.getElementById('cover-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) await setCoverFromBlob(file);
    });

    // Ctrl/Cmd+V anywhere on the page picks up an image from the clipboard.
    document.addEventListener('paste', async (e) => {
      const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
      if (!item) return;
      e.preventDefault();
      if (await setCoverFromBlob(item.getAsFile())) toast('Cover pasted', 'success');
    });

    // Button fallback for browsers/users that prefer a click (uses the Clipboard API).
    document.getElementById('paste-cover-btn').addEventListener('click', async () => {
      if (!navigator.clipboard?.read) {
        toast('This browser blocks clipboard reads — press ⌘/Ctrl+V to paste instead', 'warning');
        return;
      }
      try {
        for (const item of await navigator.clipboard.read()) {
          const type = item.types.find(t => t.startsWith('image/'));
          if (type) {
            if (await setCoverFromBlob(await item.getType(type))) toast('Cover pasted', 'success');
            return;
          }
        }
        toast('No image in clipboard — copy a cover image first', 'warning');
      } catch (err) {
        console.error('clipboard.read() failed:', err);
        const msg = err.name === 'NotAllowedError'
          ? 'Clipboard access denied — press ⌘/Ctrl+V to paste instead'
          : 'Could not read clipboard — press ⌘/Ctrl+V to paste instead';
        toast(msg, 'warning');
      }
    });

    // Save
    document.getElementById('save-btn').addEventListener('click', saveChanges);

    // Cancel
    document.getElementById('cancel-btn').addEventListener('click', () => {
      window.location.href = `book.html?isbn=${originalBook.isbn}`;
    });
  }

  async function saveChanges() {
    const title = document.getElementById('f-title').value.trim();
    const author = document.getElementById('f-author').value.trim();
    if (!title) { toast('Title is required', 'warning'); return; }

    const subject = document.getElementById('f-subject').value;

    const entry = {
      ...originalBook,
      title,
      author,
      year:        parseInt(document.getElementById('f-year').value) || null,
      publisher:   document.getElementById('f-publisher').value.trim(),
      pages:       parseInt(document.getElementById('f-pages').value) || null,
      subjects:    subject ? [subject] : [],
      description: document.getElementById('f-description').value.trim(),
      lang:        document.getElementById('f-language').value.trim(),
      // Falls back to the stored date if the field is cleared — `added` drives
      // the year/month grouping, so it should never end up empty.
      added:       document.getElementById('f-added').value || originalBook.added,
      // saveNewBook writes the upload to covers/<isbn>.webp, but `cover` is
      // spread from the original entry — null for a book that had none — so it
      // has to be pointed at the new file or the book keeps the placeholder.
      ...(coverChanged ? { cover: `covers/${originalBook.isbn}.webp` } : {}),
    };
    delete entry.source;

    const saveBtn = document.getElementById('save-btn');
    const bar = document.getElementById('progress-bar');
    const status = document.getElementById('save-status');
    document.getElementById('save-progress').style.display = '';
    saveBtn.disabled = true;
    status.textContent = 'Saving…';
    bar.style.width = '30%';

    try {
      await saveNewBook(entry, coverChanged ? coverBase64 : null, 'image/webp');
      bar.style.width = '100%';
      status.textContent = 'Saved! Redirecting…';
      toast(`"${title}" updated`, 'success');
      setTimeout(() => window.location.href = `book.html?isbn=${originalBook.isbn}`, 1200);
    } catch (err) {
      console.error(err);
      toast(`Save failed: ${err.message}`, 'error');
      saveBtn.disabled = false;
      status.textContent = `Error: ${err.message}`;
      bar.style.width = '0%';
    }
  }

  function render404() {
    document.getElementById('main-content').innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">📖</div>
        <h2>Book not found</h2>
        <p>This ISBN isn't in your library. <a href="add.html">Add it?</a></p>
      </div>`;
  }

  init();
</script>

<script src="js/theme.js"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/books/sw.js");</script>
</body>
</html>
